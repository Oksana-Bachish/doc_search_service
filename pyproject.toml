[project]
name = "elasticsearch-search-service"
version = "0.1.0"
description = "Asynchronous FastAPI microservice for high-speed document full-text search using ElasticSearch and PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    'annotated-doc==0.0.4',
    'annotated-types==0.7.0',
    'anyio==4.14.1',
    'backports.asyncio.runner==1.2.0',
    'certifi==2026.6.17',
    'click==8.4.2',
    'colorama==0.4.6',
    'elastic-transport==9.4.2',
    'elasticsearch==9.4.1',
    'exceptiongroup==1.3.1',
    'fastapi==0.139.0',
    'h11==0.16.0',
    'httpcore==1.0.9',
    'idna==3.18',
    'iniconfig==2.3.0',
    'packaging==26.2',
    'pluggy==1.6.0',
    'psycopg2-binary==2.9.12',
    'pydantic==2.13.4',
    'pydantic_core==2.46.4',
    'Pygments==2.20.0',
    'python-dateutil==2.9.0.post0',
    'python-dotenv==1.2.2',
    'six==1.17.0',
    'sniffio==1.3.1',
    'starlette==1.3.1',
    'tomli==2.4.1',
    'typing-inspection==0.4.2',
    'typing_extensions==4.16.0',
    'urllib3==2.7.0',
    'uvicorn==0.49.0',
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]